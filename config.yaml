paths:
  cache_dir: "fastf1_cache"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  reports_dir: "reports"
  notes_dir: "notes"

seasons:
  train: [2022, 2023]
  val: [2024]
  test: [2025]

cleaning:
  min_stint_laps: 8
  max_gap_laps: 3
  fuel_c: 0.03
  usable_life_threshold_s: 1.0

# Part 2 Config Flags
fuel:
  mode: "track_scaled" # constant | track_scaled
  base_c: 0.03
  ref_km: 5.0

spike:
  enabled: true
  threshold_s: 2.0
  recover_s: 1.0
  window: 3

features:
  temp_delta: true

model:
  head: "free" # free | monotone
  hidden:
    gru: 32
    lstm: 27
    rnn: 60
  horizon: 20
  baseline_causal_lap: 3
  seed: 42

loss:
  name: "huber" # huber | asym_huber
  delta: 1.0
  positive_weight: 0.5

live:
  eta: 0.3
  k_min: 0.5
  k_max: 2.0
  min_g: 0.05
  smooth_laps: 3

mc:
  passes: 30
  sigma_k: 0.1

